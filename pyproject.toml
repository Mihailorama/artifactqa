[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artifactqa"
version = "0.1.0"
description = "Evidence-bound inspection receipts for generated media."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mihailorama" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/mihailorama/artifactqa"
Repository = "https://github.com/mihailorama/artifactqa"

[tool.hatch.build.targets.wheel]
packages = ["src/artifactqa"]
